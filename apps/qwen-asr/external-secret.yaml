# Syncs the OpenAI-compatible Bearer API key from AWS SSM Parameter Store.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: qwen-asr-secrets
  namespace: qwen-asr
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: qwen-asr-secrets
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: /homelab/qwen-asr/api-key
