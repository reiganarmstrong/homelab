# Pulls the Beszel Hub's shared SSH public key from AWS SSM Parameter Store
# so every Beszel Agent pod in the DaemonSet authenticates cleanly.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: beszel-agent-key
  namespace: beszel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: beszel-agent-key
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: /homelab/beszel/agent-key
