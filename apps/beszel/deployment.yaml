apiVersion: apps/v1
kind: Deployment
metadata:
  name: beszel-hub
  namespace: beszel
  labels:
    app.kubernetes.io/name: beszel-hub
spec:
  replicas: 1
  # Recreate strategy is required because `local-path` PVCs are ReadWriteOnce (RWO):
  # Kubernetes must stop the old pod before attaching the volume to the new pod.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: beszel-hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beszel-hub
    spec:
      # Pin stateful local-path workloads to the `pc` node so the pod always
      # schedules onto the machine that holds its local disk volume.
      nodeSelector:
        kubernetes.io/hostname: pc
      containers:
        - name: beszel-hub
          image: henrygd/beszel:0.21.1
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          env:
            - name: CHECK_UPDATES
              value: "false"
            - name: TZ
              value: America/New_York
          volumeMounts:
            - name: data
              mountPath: /beszel_data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            exec:
              command:
                - /beszel
                - health
                - --url
                - http://127.0.0.1:8090
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - /beszel
                - health
                - --url
                - http://127.0.0.1:8090
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: beszel-data
