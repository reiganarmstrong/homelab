# Exposes Jellyfin privately on your Tailnet at:
#   https://jellyfin.<your-tailnet>.ts.net
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - jellyfin
  defaultBackend:
    service:
      name: jellyfin
      port:
        number: 8096
