apiVersion: v1
kind: ConfigMap
metadata:
  name: jellyfin-s3-backup-script
  namespace: jellyfin
data:
  backup.sh: |
    #!/usr/bin/env bash
    set -Eeuo pipefail

    log() { printf '%s %s\n' "$(date --iso-8601=seconds)" "$*"; }

    : "${S3_BUCKET:?S3_BUCKET is required}"
    : "${AWS_REGION:=us-east-1}"
    : "${JELLYFIN_VERSION:=12.3}"
    : "${DAILY_STATE_RETENTION_DAYS:=14}"
    : "${MONTHLY_STATE_RETENTION_DAYS:=180}"

    local_date=$(TZ=America/New_York date +%F)
    local_month=$(TZ=America/New_York date +%Y-%m)
    safe_version=${JELLYFIN_VERSION//[^A-Za-z0-9._-]/_}

    daily_state_key="state/daily/jellyfin-state-${local_date}-v${safe_version}.tar.zst"
    monthly_state_key="state/monthly/jellyfin-state-${local_month}-v${safe_version}.tar.zst"

    tmpdir=$(mktemp -d)
    scaled_down=false

    cleanup() {
      if [[ "$scaled_down" == true ]]; then
        log "Scaling deployment/jellyfin back to 1"
        kubectl -n jellyfin scale deployment/jellyfin --replicas=1 || true
      fi
      rm -rf -- "$tmpdir"
    }
    trap cleanup EXIT

    put_locked_object() {
      local src="$1" key="$2" storage_class="$3" retention_days="$4" sha="$5"
      local retain_until
      retain_until=$(date -u -d "+${retention_days} days" +%Y-%m-%dT%H:%M:%SZ)
      aws s3api put-object \
        --region "$AWS_REGION" \
        --bucket "$S3_BUCKET" \
        --key "$key" \
        --body "$src" \
        --storage-class "$storage_class" \
        --server-side-encryption AES256 \
        --checksum-algorithm SHA256 \
        --metadata "sha256=${sha}" \
        --object-lock-mode GOVERNANCE \
        --object-lock-retain-until-date "$retain_until" >/dev/null
    }

    log "Validating AWS S3 bucket access"
    aws s3api get-bucket-location --region "$AWS_REGION" --bucket "$S3_BUCKET" >/dev/null

    log "Scaling deployment/jellyfin to 0 for a consistent SQLite snapshot"
    kubectl -n jellyfin scale deployment/jellyfin --replicas=0
    scaled_down=true
    kubectl -n jellyfin wait --for=delete pod -l app.kubernetes.io/name=jellyfin --timeout=150s || true

    archive="${tmpdir}/jellyfin-state-${local_date}-v${safe_version}.tar.zst"
    log "Creating zstd-compressed config archive"
    tar --zstd -cf "$archive" -C /srv/jellyfin config
    zstd --test --quiet "$archive"

    log "Scaling deployment/jellyfin back to 1"
    kubectl -n jellyfin scale deployment/jellyfin --replicas=1
    scaled_down=false
    kubectl -n jellyfin rollout status deployment/jellyfin --timeout=180s

    state_sha=$(sha256sum "$archive" | awk '{print $1}')
    log "Uploading daily state archive: s3://${S3_BUCKET}/${daily_state_key}"
    put_locked_object "$archive" "$daily_state_key" STANDARD "$DAILY_STATE_RETENTION_DAYS" "$state_sha"

    if aws s3api head-object --region "$AWS_REGION" --bucket "$S3_BUCKET" --key "$monthly_state_key" >/dev/null 2>&1; then
      log "Monthly state already exists: s3://${S3_BUCKET}/${monthly_state_key}"
    else
      log "Uploading monthly state archive to DEEP_ARCHIVE: s3://${S3_BUCKET}/${monthly_state_key}"
      put_locked_object "$archive" "$monthly_state_key" DEEP_ARCHIVE "$MONTHLY_STATE_RETENTION_DAYS" "$state_sha"
    fi

    log "Incrementally syncing /media to S3 Glacier Deep Archive (no remote deletion)"
    aws s3 sync \
      /srv/jellyfin/media/ \
      "s3://${S3_BUCKET}/media/" \
      --region "$AWS_REGION" \
      --storage-class DEEP_ARCHIVE \
      --sse AES256 \
      --checksum-algorithm SHA256 \
      --no-follow-symlinks \
      --only-show-errors

    log "Jellyfin S3 backup completed cleanly"
