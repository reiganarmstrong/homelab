# Syncs Jellyfin's S3 Glacier Deep Archive backup bucket & IAM credentials
# from AWS SSM Parameter Store into a Kubernetes Secret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jellyfin-s3-backup-creds
  namespace: jellyfin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: jellyfin-s3-backup-creds
    creationPolicy: Owner
  data:
    - secretKey: S3_BUCKET
      remoteRef:
        key: /homelab/jellyfin/s3-bucket
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /homelab/jellyfin/aws-access-key-id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /homelab/jellyfin/aws-secret-access-key
