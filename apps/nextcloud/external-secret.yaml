# Syncs Nextcloud's PostgreSQL and admin passwords from AWS SSM Parameter Store.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nextcloud-secrets
  namespace: nextcloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: nextcloud-secrets
    creationPolicy: Owner
  data:
    - secretKey: postgres_password
      remoteRef:
        key: /homelab/nextcloud/postgres-password
    - secretKey: nextcloud_admin_password
      remoteRef:
        key: /homelab/nextcloud/admin-password
