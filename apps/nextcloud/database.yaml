---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  namespace: nextcloud
  labels:
    app.kubernetes.io/name: nextcloud-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nextcloud-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextcloud-postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: pc
      terminationGracePeriodSeconds: 180
      containers:
        - name: postgres
          image: postgres:17-alpine
          args:
            - postgres
            - -c
            - shared_buffers=1GB
            - -c
            - effective_cache_size=4GB
            - -c
            - maintenance_work_mem=512MB
            - -c
            - work_mem=16MB
            - -c
            - random_page_cost=1.1
            - -c
            - effective_io_concurrency=200
            - -c
            - checkpoint_completion_target=0.9
            - -c
            - checkpoint_timeout=15min
            - -c
            - max_wal_size=4GB
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: TZ
              value: America/New_York
            - name: POSTGRES_DB
              value: nextcloud
            - name: POSTGRES_USER
              value: nextcloud
            - name: POSTGRES_PASSWORD_FILE
              value: /etc/nextcloud-secrets/postgres_password
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: secrets
              mountPath: /etc/nextcloud-secrets
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "nextcloud", "-d", "nextcloud"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: data
          hostPath:
            path: /srv/nextcloud/data/postgres
            type: Directory
        - name: secrets
          secret:
            secretName: nextcloud-secrets
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: database
  namespace: nextcloud
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nextcloud-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
