---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-app
  namespace: nextcloud
  labels:
    app.kubernetes.io/name: nextcloud-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nextcloud-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextcloud-app
    spec:
      nodeSelector:
        kubernetes.io/hostname: pc
      terminationGracePeriodSeconds: 120
      containers:
        - name: nextcloud
          image: nextcloud:33.0.10-apache
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: TZ
              value: America/New_York
            - name: POSTGRES_HOST
              value: database
            - name: POSTGRES_DB
              value: nextcloud
            - name: POSTGRES_USER
              value: nextcloud
            - name: POSTGRES_PASSWORD_FILE
              value: /etc/nextcloud-secrets/postgres_password
            - name: REDIS_HOST
              value: redis
            - name: NEXTCLOUD_ADMIN_USER
              value: admin
            - name: NEXTCLOUD_ADMIN_PASSWORD_FILE
              value: /etc/nextcloud-secrets/nextcloud_admin_password
            - name: NEXTCLOUD_INIT_HTACCESS
              value: "true"
            - name: APACHE_DISABLE_REWRITE_IP
              value: "1"
            - name: TRUSTED_PROXIES
              value: "10.42.0.0/16"
            - name: OVERWRITEPROTOCOL
              value: "https"
            - name: PHP_MEMORY_LIMIT
              value: "2G"
            - name: PHP_UPLOAD_LIMIT
              value: "16G"
            - name: APACHE_BODY_LIMIT
              value: "17179869184"
          volumeMounts:
            - name: html
              mountPath: /var/www/html
            - name: php-config
              mountPath: /usr/local/etc/php/conf.d/zz-nextcloud.ini
              subPath: zz-nextcloud.ini
              readOnly: true
            - name: secrets
              mountPath: /etc/nextcloud-secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /status.php
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /status.php
              port: http
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 4Gi
      volumes:
        - name: html
          hostPath:
            path: /srv/nextcloud/nextcloud
            type: Directory
        - name: php-config
          configMap:
            name: nextcloud-php-config
        - name: secrets
          secret:
            secretName: nextcloud-secrets
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-app
  namespace: nextcloud
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nextcloud-app
  ports:
    - name: http
      port: 80
      targetPort: http
