apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-cron
  namespace: nextcloud
  labels:
    app.kubernetes.io/name: nextcloud-cron
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nextcloud-cron
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextcloud-cron
    spec:
      nodeSelector:
        kubernetes.io/hostname: pc
      terminationGracePeriodSeconds: 120
      containers:
        - name: nextcloud-cron
          image: nextcloud:33.0.10-apache
          command: ["/cron.sh"]
          env:
            - name: TZ
              value: America/New_York
            - name: POSTGRES_HOST
              value: database
            - name: POSTGRES_DB
              value: nextcloud
            - name: POSTGRES_USER
              value: nextcloud
            - name: POSTGRES_PASSWORD_FILE
              value: /etc/nextcloud-secrets/postgres_password
            - name: REDIS_HOST
              value: redis
            - name: PHP_MEMORY_LIMIT
              value: "2G"
            - name: PHP_UPLOAD_LIMIT
              value: "16G"
          volumeMounts:
            - name: html
              mountPath: /var/www/html
            - name: php-config
              mountPath: /usr/local/etc/php/conf.d/zz-nextcloud.ini
              subPath: zz-nextcloud.ini
              readOnly: true
            - name: secrets
              mountPath: /etc/nextcloud-secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 1Gi
      volumes:
        - name: html
          hostPath:
            path: /srv/nextcloud/nextcloud
            type: Directory
        - name: php-config
          configMap:
            name: nextcloud-php-config
        - name: secrets
          secret:
            secretName: nextcloud-secrets
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
