# Exposes Home Assistant privately on your Tailnet at:
#   https://homeassistant.<your-tailnet>.ts.net
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - homeassistant
  defaultBackend:
    service:
      name: home-assistant
      port:
        number: 8123
