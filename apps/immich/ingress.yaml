# Exposes Immich privately on your Tailnet at:
#   https://immich.<your-tailnet>.ts.net
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich-server
  namespace: immich
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - immich
  defaultBackend:
    service:
      name: immich-server
      port:
        number: 2283
