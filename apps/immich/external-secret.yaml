# Syncs Immich DB password and S3 Glacier backup credentials from AWS SSM Parameter Store.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: immich-secrets
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: immich-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: /homelab/immich/db-password
    - secretKey: S3_BUCKET
      remoteRef:
        key: /homelab/immich/s3-bucket
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /homelab/immich/aws-access-key-id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /homelab/immich/aws-secret-access-key
