---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: pc
      # Disable legacy K8s service-link env vars (e.g. REDIS_PORT=tcp://...) which collide with Immich's REDIS_PORT.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      securityContext:
        supplementalGroups:
          - 991
        # Avoid Ubuntu 26.04 AppArmor stacking denials on tini signal forwarding.
        appArmorProfile:
          type: Unconfined
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:v3.3.5
          ports:
            - name: http
              containerPort: 2283
              protocol: TCP
          env:
            - name: TZ
              value: America/New_York
            - name: DB_HOSTNAME
              value: database
            - name: DB_USERNAME
              value: postgres
            - name: DB_DATABASE_NAME
              value: immich
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: DB_PASSWORD
            - name: REDIS_HOSTNAME
              value: redis
            - name: IMMICH_MACHINE_LEARNING_URL
              value: http://immich-machine-learning:3003
          securityContext:
            # Required for containerd cgroup device access to /dev/dri/renderD128 (Intel QuickSync/VAAPI).
            privileged: true
          volumeMounts:
            - name: library
              mountPath: /data
            - name: dri
              mountPath: /dev/dri
          startupProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 8Gi
      volumes:
        - name: library
          hostPath:
            path: /srv/immich/library
            type: Directory
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: immich
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: immich-server
  ports:
    - name: http
      port: 2283
      targetPort: http
