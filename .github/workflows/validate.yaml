name: Validate Kubernetes Manifests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kustomize & kubeconform
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          curl -sSL "https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz" | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kustomize overlays
        run: |
          for dir in \
            infrastructure/external-secrets-config \
            infrastructure/tailscale-operator \
            infrastructure/argocd-ingress \
            apps/beszel \
            apps/home-assistant \
            apps/jellyfin \
            apps/immich \
            apps/qwen-asr; do
            echo "Building $dir..."
            kustomize build "$dir" | kubeconform \
              -strict \
              -ignore-missing-schemas \
              -summary
          done

      - name: Validate Argo CD Applications
        run: |
          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -summary \
            bootstrap/argocd/root-app.yaml \
            infrastructure/applications \
            apps/applications
