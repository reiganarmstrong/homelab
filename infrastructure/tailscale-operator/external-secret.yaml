# Syncs Tailscale OAuth credentials from AWS SSM Parameter Store into the
# `operator-oauth` Secret expected by the Tailscale Kubernetes Operator.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tailscale-operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: /homelab/tailscale/oauth-client-id
    - secretKey: client_secret
      remoteRef:
        key: /homelab/tailscale/oauth-client-secret
